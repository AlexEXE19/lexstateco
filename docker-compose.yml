services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexstate}
      POSTGRES_USER: ${POSTGRES_USER:-lexuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexuser} -d ${POSTGRES_DB:-lexstate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    image: lexstate_server:latest
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-lexuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      DB_NAME: ${POSTGRES_DB:-lexstate}
      JWT_SECRET: ${JWT_SECRET:-replace_me}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    ports:
      - "5000:5000"
    restart: on-failure

  client:
    build:
      context: ./client
      args:
        VITE_API_HOST: ${VITE_API_HOST:-http://localhost}
        VITE_API_PORT: ${VITE_API_PORT:-5000}
    image: lexstate_client:latest
    depends_on:
      - server
    networks:
      - frontend
    ports:
      - "8080:80"
    restart: on-failure

volumes:
  postgres_data:

networks:
  backend:
  frontend:
