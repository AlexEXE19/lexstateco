services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lexstate}
      MYSQL_USER: ${MYSQL_USER:-lexuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_me}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    image: lexstate_server:latest
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-lexuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      DB_NAME: ${MYSQL_DATABASE:-lexstate}
      JWT_SECRET: ${JWT_SECRET:-replace_me}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    ports:
      - "5000:5000"
    restart: on-failure

  client:
    build:
      context: ./client
      args:
        VITE_API_HOST: ${VITE_API_HOST:-http://localhost}
        VITE_API_PORT: ${VITE_API_PORT:-5000}
    image: lexstate_client:latest
    depends_on:
      - server
    networks:
      - frontend
    ports:
      - "8080:80"
    restart: on-failure

volumes:
  mysql_data:

networks:
  backend:
  frontend:
